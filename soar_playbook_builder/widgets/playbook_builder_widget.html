<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SOAR Playbook Builder</title>
  <link rel="stylesheet" href="./playbook_builder_widget.css" />
</head>
<body data-mcp-url="{{MCP_URL}}">
  <h2>SOAR Playbook Builder</h2>
  <p class="instructions">{{AI_INSTRUCTIONS}}</p>
  <label>Playbook ID: <input type="number" id="playbook_id" placeholder="e.g. 42" /></label>
  <button type="button" id="poll">Poll for changes</button>
  <button type="button" id="reset">Reset snapshot</button>
  <div id="refresh_banner" class="banner">Playbook changed — refresh the Visual Editor to see updates.</div>
  <div id="log"></div>
  <script src="./playbook_builder_widget.js"></script>
</body>
</html>
