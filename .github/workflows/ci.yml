name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python tests and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test and audit tools
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt \
            pytest==9.1.1 \
            bandit==1.9.4 \
            pip-audit==2.10.1 \
            jsonschema==4.26.0

      - name: Compile Python
        run: python -m compileall -q soar_playbook_builder tests scripts

      - name: Check local documentation links
        run: python scripts/check_docs.py

      - name: Run unit tests
        run: python -m pytest -q tests

      - name: Run capability evaluation gate
        run: python soar_playbook_builder/eval/harness.py --suite all

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Reject high-confidence, high-severity Python findings
        run: python -m bandit -q -r soar_playbook_builder -lll -iii

  web:
    name: ${{ matrix.project }} build and audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: sidecar-ui
            lockfile: sidecar-ui/package-lock.json
          - project: validation-console
            lockfile: validation-console/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Run component and accessibility tests when present
        run: npm test --if-present

      - name: Install Chromium for browser tests
        if: matrix.project == 'sidecar-ui'
        run: npx --no-install playwright install --with-deps chromium

      - name: Run offline browser tests when present
        run: npm run test:e2e --if-present

      - name: Type-check and build
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.project }}-sbom-${{ github.sha }}
          path: ${{ matrix.project }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build and inspect SOAR package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sidecar-ui/package-lock.json

      - name: Build installable archive
        run: ./package_app.sh

      - name: Verify archive structure and manifest
        run: |
          test -s dist/soar_playbook_builder.tgz
          python scripts/inspect_app_archive.py dist/soar_playbook_builder.tgz

      - name: Upload installable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soar-playbook-builder-${{ github.sha }}
          path: dist/soar_playbook_builder.tgz
          if-no-files-found: error
          retention-days: 14
